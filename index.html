/* Étude BACS : interface. Charte « Consigne » : gris process, encre graphite, rayon 0, sans ombre,
   une seule couleur de signal (violet exigence) réservée à ce qui est à traiter. */
:root {
  --process: #D4D7DA; --releve: #F3F4F5; --carter: #9AA0A6; --gris: #5C636A; --graphite: #1B1E21; --acier: #2A2F34;
  --blanc: #FFFFFF; --trame: rgba(27, 30, 33, .06); --filet: #BCC1C6;
  --signal: #9B87FF; --signal-clair: #E6E0FF;
  --f-titre: Archivo, 'Arial Narrow', sans-serif; --f-data: 'Martian Mono', ui-monospace, monospace; --f-texte: Atkinson, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; }
body {
  font: 15px/1.45 var(--f-texte); color: var(--graphite);
  background-color: var(--process);
  background-image: linear-gradient(var(--trame) 1px, transparent 1px), linear-gradient(90deg, var(--trame) 1px, transparent 1px);
  background-size: 16px 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--graphite); }
:focus-visible { outline: 2px solid var(--graphite); outline-offset: 2px; }

.data, .etiquette, .verdict-etiquette, .repere, .etape-n, .etape-etat, .ref, .unite, .marque-edition, th { font-family: var(--f-data); font-stretch: 87.5%; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; font-variant-numeric: tabular-nums; }

/* Barre du haut */
.barre-haut { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; background: var(--graphite); color: var(--releve); }
.marque { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.marque .bulle circle { fill: var(--releve); stroke: var(--releve); }
.marque .bulle line { stroke: var(--graphite); }
.marque .bulle text { fill: var(--graphite); }
.marque-nom { font: 800 26px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; letter-spacing: .01em; }
.marque-edition { font-size: 10px; color: var(--carter); padding-top: 4px; }
.dossier-courant { flex: 1; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dossier-courant span { margin-left: 12px; font: 500 11px var(--f-data); color: var(--carter); letter-spacing: .05em; }
.barre-actions { display: flex; gap: 8px; }

.bulle circle { fill: var(--releve); stroke: var(--graphite); stroke-width: 1.5; }
.bulle line { stroke: var(--graphite); stroke-width: 1.2; }
.bulle text { font: 600 9px var(--f-data); fill: var(--graphite); letter-spacing: .04em; }

/* Disposition */
.corps { display: flex; align-items: flex-start; }
.etapes { position: sticky; top: 56px; flex: 0 0 232px; height: calc(100vh - 56px); padding: 24px 0 16px; background: var(--releve); border-right: 1.5px solid var(--graphite); display: flex; flex-direction: column; }
.etape { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; background: none; border: 0; border-left: 4px solid transparent; text-align: left; cursor: pointer; }
.etape:hover { background: var(--process); }
.etape.active { border-left-color: var(--graphite); background: var(--blanc); font-weight: 700; }
.etape-n { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid var(--graphite); font-size: 11px; }
.etape.active .etape-n { background: var(--graphite); color: var(--releve); }
.etape-titre { flex: 1; }
.etape-etat { font-size: 10px; padding: 2px 6px; border: 1px solid var(--carter); color: var(--gris); }
.etape-etat.etat-signal { background: var(--signal); border-color: var(--signal); color: var(--graphite); font-weight: 700; }
.etapes-pied { margin: auto 16px 0; font-size: 12px; color: var(--gris); }
.contenu { flex: 1; min-width: 0; max-width: 1240px; padding: 24px 32px 64px; }
.contenu-large { margin: 0 auto; }
.suite { display: flex; justify-content: flex-end; margin-top: 8px; }

/* Panneaux */
.panneau { background: var(--releve); border: 1.5px solid var(--graphite); margin-bottom: 16px; }
.panneau-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px 20px 12px; border-bottom: 1px solid var(--filet); }
.panneau-tete h2 { margin: 0; font: 800 24px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; letter-spacing: .005em; }
.panneau-tete p { margin: 6px 0 0; color: var(--gris); font-size: 14px; max-width: 70ch; }
.panneau-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.panneau-corps { padding: 16px 20px 20px; }

/* Formulaires */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.grille-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grille-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.champ { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.champ-large { grid-column: 1 / -1; }
.grille-3 .champ-large, .grille-4 .champ-large { grid-column: span 2; }
.champ label, .champ-titre { font-size: 13px; font-weight: 600; color: var(--acier); }
.champ-aide { margin: 0; font-size: 12px; color: var(--gris); }
input[type=text], input[type=date], input:not([type]), select, textarea {
  width: 100%; min-height: 36px; padding: 6px 10px; background: var(--blanc); border: 1px solid var(--carter); border-bottom: 1.5px solid var(--graphite);
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--graphite); box-shadow: inset 0 -2px 0 var(--graphite); }
.saisie-unite { display: flex; }
.saisie-unite input { text-align: right; font-family: var(--f-data); font-stretch: 87.5%; font-size: 14px; }
.saisie-unite .unite { display: grid; place-items: center; padding: 0 8px; min-width: 44px; background: var(--process); border: 1px solid var(--carter); border-left: 0; border-bottom: 1.5px solid var(--graphite); font-size: 10px; color: var(--acier); }
.saisie-unite.invalide input { border-color: var(--graphite); background: var(--signal-clair); }
.case { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; font-size: 14px; }
.case input { width: 18px; height: 18px; accent-color: var(--graphite); }
.champ-case { justify-content: flex-start; }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 14px; border: 1.5px solid var(--graphite); background: var(--releve); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--process); }
.btn-principal { background: var(--graphite); color: var(--releve); }
.btn-principal:hover { background: var(--acier); }
.btn-discret { border-color: transparent; background: none; color: var(--gris); font-weight: 500; padding: 4px 8px; min-height: 28px; }
.btn-discret:hover { color: var(--graphite); background: var(--process); }
.btn-inverse, .btn-inverse-actif { background: transparent; color: var(--releve); border-color: var(--gris); }
.btn-inverse:hover { background: var(--acier); }
.btn-inverse-actif, .btn-inverse-actif:hover { border-color: var(--releve); background: var(--acier); }
.btn:disabled { opacity: .5; cursor: progress; }
.depot { position: relative; }
.depot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.lien { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; text-align: left; }
.lien-fort { font-weight: 700; text-decoration: none; }
.lien-fort:hover { text-decoration: underline; }
.rangee { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.segments { display: inline-flex; align-self: flex-start; flex-wrap: wrap; border: 1.5px solid var(--graphite); background: var(--blanc); }
.seg { border: 0; border-right: 1px solid var(--carter); background: none; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg:last-child { border-right: 0; }
.seg:hover { background: var(--process); }
.seg.actif { background: var(--graphite); color: var(--releve); }
.segments-petit .seg { padding: 4px 9px; font: 500 11px var(--f-data); font-stretch: 87.5%; letter-spacing: .05em; min-width: 38px; }
.segments-petit .seg-nonConforme.actif { background: var(--signal); color: var(--graphite); }

.etiquette { display: inline-block; margin-right: 8px; font-size: 10px; color: var(--gris); }
.etiquette-forte { background: var(--graphite); color: var(--releve); padding: 3px 8px; }
.note { color: var(--gris); font-size: 13px; margin: 12px 0 0; }
.texte { max-width: 75ch; margin: 0; }
.regime { margin: 16px 0 0; padding: 10px 12px; background: var(--blanc); border-left: 4px solid var(--graphite); }
.vide { padding: 20px; border: 1px dashed var(--carter); background: var(--blanc); color: var(--acier); }
.vide p { margin: 0 0 6px; max-width: 70ch; }
.vide-titre { font-weight: 700; color: var(--graphite); }

.alerte { margin: 8px 0 0; padding: 10px 12px; border-left: 4px solid var(--carter); background: var(--blanc); font-size: 14px; }
.alerte-bloquant { border-left-color: var(--signal); background: var(--signal-clair); }
.alerte-conseil { border-left-color: var(--graphite); }
.alerte-info { border-left-color: var(--carter); color: var(--acier); }
.pile { margin-top: 12px; }

/* Tableaux */
.tableau { width: 100%; border-collapse: collapse; background: var(--blanc); font-size: 14px; }
.tableau th { text-align: left; font-size: 10px; color: var(--acier); padding: 8px 10px; background: var(--process); border-bottom: 1.5px solid var(--graphite); }
.tableau td { padding: 10px; border-bottom: 1px solid var(--process); vertical-align: top; }
.tableau .num { text-align: right; white-space: nowrap; font-family: var(--f-data); font-stretch: 87.5%; }
.sous-ligne { display: block; color: var(--gris); font-size: 12px; margin-top: 2px; }
.puce-eq { display: block; font-size: 13px; }
.col-barre { width: 26%; min-width: 200px; }
.actions-ligne { text-align: right; white-space: nowrap; }
td.data { font-size: 12px; }
.etat { display: inline-block; padding: 2px 8px; border: 1px solid var(--graphite); font: 500 11px var(--f-data); font-stretch: 87.5%; text-transform: uppercase; letter-spacing: .05em; }
.etat-echeance-depassee { background: var(--signal); }
.etat-incomplet, .etat-non-assujetti, .etat-hors-champ { border-color: var(--carter); color: var(--gris); }

/* Barre analogique de puissance */
.barre { padding: 14px 0 4px; }
.barre-piste { position: relative; height: 10px; background: var(--process); border: 1px solid var(--carter); }
.barre-zone { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(27,30,33,.18) 4px 5px); }
.barre-zone-haute { background: repeating-linear-gradient(135deg, transparent 0 2px, rgba(27,30,33,.3) 2px 3px); }
.barre-seuil { position: absolute; top: -6px; bottom: -4px; width: 0; border-left: 1.5px solid var(--graphite); }
.barre-seuil span { position: absolute; top: -12px; left: 3px; font: 500 9px var(--f-data); color: var(--gris); }
.barre-curseur { position: absolute; top: -5px; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-top: 9px solid var(--graphite); }
.barre-curseur::after { content: ''; position: absolute; left: -1px; top: -1px; width: 2px; height: 18px; background: var(--graphite); }

/* Verdicts et résultats */
.verdict, .resultat-tri, .resultat-ins, .synthese { background: var(--blanc); border: 1.5px solid var(--graphite); border-left-width: 8px; padding: 16px 20px; margin-bottom: 16px; }
.verdict-signal { border-left-color: var(--signal); }
.verdict-etiquette { margin: 0 0 6px; font-size: 10px; color: var(--gris); }
.verdict-titre { margin: 0; font: 800 44px/0.92 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.verdict-texte { margin: 8px 0 0; max-width: 70ch; }
.verdict-mesure { display: flex; align-items: baseline; gap: 12px; margin: 12px 0 0; }
.verdict-mesure span { font: 500 10px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.verdict-mesure strong { font: 800 28px var(--f-titre); font-stretch: 62%; }
.resultat-ins .verdict-titre { font-size: 34px; }

.trace { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.trace li { display: grid; grid-template-columns: 200px 1fr 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--process); }
.trace p { margin: 0; font-size: 14px; }
.trace-etape { font-weight: 700; }
.trace-regle { color: var(--acier); }
.ref { display: block; margin-top: 4px; font-size: 10px; color: var(--gris); }

.deux-colonnes { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.colonne-resultat { position: sticky; top: 72px; }
.tri-valeur { display: flex; align-items: baseline; gap: 8px; margin: 0; }
.tri-valeur strong { font: 800 88px/0.9 var(--f-titre); font-stretch: 62%; }
.tri-valeur span { font: 800 28px var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.resultat-non-rentable .tri-valeur strong { color: var(--graphite); }
.jauge-tri { position: relative; height: 10px; margin: 18px 0 4px; background: linear-gradient(90deg, var(--process) 50%, transparent 50%), repeating-linear-gradient(135deg, var(--releve) 0 3px, var(--carter) 3px 4px); border: 1px solid var(--carter); }
.jauge-seuil { position: absolute; top: -14px; bottom: -4px; border-left: 1.5px solid var(--graphite); }
.jauge-seuil span { position: absolute; top: -2px; left: 4px; font: 500 9px var(--f-data); color: var(--gris); white-space: nowrap; }
.jauge-curseur { position: absolute; top: -5px; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-top: 9px solid var(--graphite); }
.mesures { display: grid; gap: 0; margin: 14px 0 0; }
.mesures div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--process); }
.mesures dt { font: 500 10px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); padding-top: 3px; }
.mesures dd { margin: 0; font-weight: 700; text-align: right; font-family: var(--f-data); font-stretch: 87.5%; font-size: 13px; }
.mesures-panneau { background: var(--blanc); border: 1.5px solid var(--graphite); padding: 6px 16px; margin: 0 0 16px; }
.avancement { height: 6px; background: var(--process); margin-bottom: 12px; }
.avancement div { height: 100%; background: var(--graphite); }
.compteurs { list-style: none; margin: 0; padding: 0; }
.cpt { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; border-bottom: 1px solid var(--process); }
.cpt-nonConforme strong { background: var(--signal); padding: 0 6px; }

/* Équipements et lignes de saisie */
.equipements { list-style: none; margin: 0; padding: 0; }
.equipement { background: var(--blanc); border: 1px solid var(--carter); border-left: 4px solid var(--graphite); padding: 12px 16px 14px; margin-bottom: 12px; }
.equipement-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.repere { font-size: 12px; color: var(--gris); }
.equipement-nom { flex: 1; font-weight: 700; font-size: 16px; border: 0; border-bottom: 1.5px solid var(--carter); background: none; padding: 4px 2px; min-height: 32px; }
.retenu { font: 600 13px var(--f-data); font-stretch: 87.5%; background: var(--graphite); color: var(--releve); padding: 4px 10px; white-space: nowrap; }
.retenu-non { background: var(--process); color: var(--gris); }
.equipement-regle { margin: 12px 0 0; font-size: 13px; color: var(--acier); }
.ligne-saisie { background: var(--blanc); border: 1px solid var(--carter); padding: 12px 16px; margin-bottom: 10px; }
.ligne-retenue { border-left: 4px solid var(--graphite); }
.ligne-simple { display: flex; align-items: flex-end; gap: 12px; }
.ligne-simple .grille { flex: 1; }
.ligne-pied { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
.calc-ligne { font-size: 13px; color: var(--acier); }

/* Inspection */
.points { list-style: none; margin: 0; padding: 0; }
.point { padding: 10px 0 12px; border-bottom: 1px solid var(--process); }
.point-tete { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.point-libelle { margin: 0; font-weight: 600; }
.point-aide { margin: 2px 0 0; font-size: 13px; color: var(--gris); max-width: 62ch; }
.point-obs { margin-top: 8px; min-height: 32px; font-size: 14px; }
.point-nonConforme { box-shadow: inset 4px 0 0 var(--signal); padding-left: 12px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.photo { margin: 0; background: var(--blanc); border: 1px solid var(--carter); padding: 8px; }
.photo img { width: 100%; height: 130px; object-fit: cover; display: block; margin-bottom: 6px; }
.logo-zone { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.logo-apercu { max-height: 56px; max-width: 200px; background: var(--blanc); border: 1px solid var(--carter); padding: 4px; }
.references { margin: 0; padding-left: 18px; }
.references li { margin-bottom: 6px; }

/* Aperçu des documents */
.apercu { display: flex; justify-content: center; padding: 8px 0 24px; }

.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { margin: 0; padding: 10px 14px; background: var(--graphite); color: var(--releve); border-left: 6px solid var(--carter); max-width: 420px; font-size: 14px; }
.toast-erreur { border-left-color: var(--signal); }

@media (max-width: 1100px) {
  .deux-colonnes { grid-template-columns: 1fr; }
  .colonne-resultat { position: static; order: -1; }
  .grille-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trace li { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 800px) {
  .etapes { display: none; }
  .contenu { padding: 16px; }
  .grille-3, .grille-4 { grid-template-columns: 1fr; }
  .grille-3 .champ-large, .grille-4 .champ-large { grid-column: auto; }
  .marque-edition, .dossier-courant { display: none; }
}

@media print {
  body { background: #fff; }
  .barre-haut, .etapes, .toasts, .suite, .panneau, .alerte { display: none !important; }
  .corps, .contenu { display: block; padding: 0; margin: 0; max-width: none; }
  .apercu { display: block; padding: 0; }
}

/* Accueil : repères réglementaires */
.reperes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--graphite); background: var(--blanc); }
.reperes div { padding: 14px 16px; border-right: 1px solid var(--process); }
.reperes div:last-child { border-right: 0; }
.reperes dt { font: 500 10px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.reperes dd { margin: 4px 0 0; }
.reperes strong { display: block; font: 800 30px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; margin-bottom: 4px; }
.etapes-accueil { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 80ch; }
@media (max-width: 1000px) { .reperes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Écarts associés à une recommandation */
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1.5px solid var(--carter); background: #fff; color: var(--graphite); font: inherit; font-size: 12px; cursor: pointer; }
.puce:hover { border-color: var(--graphite); }
.puce-code { font-family: 'Martian Mono', monospace; font-size: 10px; letter-spacing: .04em; color: var(--gris); }
.puce-active { background: var(--graphite); border-color: var(--graphite); color: var(--releve); }
.puce-active .puce-code { color: var(--signal); }
.puce:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Visite : compléments d'interface (même charte que l'étude BACS, signal violet exigence). */
.tableau-saisie td { padding: 6px 8px; vertical-align: middle; }
.tableau-saisie input[type=text], .tableau-saisie select { min-height: 32px; padding: 4px 8px; font-size: 14px; }
.nombre-cellule { width: 100%; min-width: 80px; text-align: right; font-family: var(--f-data); font-stretch: 87.5%; }
.nombre-cellule.invalide { background: var(--signal-clair); }
.data-saisie { font-family: var(--f-data); font-stretch: 87.5%; font-size: 12px !important; }
.saisie-discrete { display: block; width: 100%; margin-top: 4px; border: 0 !important; border-bottom: 1px dashed var(--carter) !important; background: transparent !important; min-height: 26px !important; padding: 2px 0 !important; font-size: 13px !important; color: var(--acier); }
.tableau-articles { table-layout: fixed; width: 100%; }
.tableau-articles .c-article { width: 25%; }
.tableau-articles .c-masse { width: 96px; }
.tableau-articles .c-mentions { width: 19%; }
.tableau-articles .c-typo { width: 18%; }
.tableau-articles .c-etat { width: 112px; }
.tableau-articles .c-rub { width: 13%; }
.tableau-articles .c-act { width: 76px; }
.tableau-articles td { vertical-align: top; }
.tableau-articles input[type=text], .tableau-articles select { width: 100%; min-width: 0; }
.tableau-articles td:first-child strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sous-ligne-signal { color: var(--graphite); background: var(--signal-clair); padding: 1px 4px; display: inline-block; }
.ligne-signal td:first-child { box-shadow: inset 4px 0 0 var(--signal); }
.rangee-filtre { align-items: center; margin: 16px 0 12px; }
.rangee-filtre input[type=search] { flex: 1; max-width: 520px; min-height: 36px; padding: 6px 10px; background: var(--blanc); border: 1px solid var(--carter); border-bottom: 1.5px solid var(--graphite); }
.pagination { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12px; }
.plan-apercu { max-height: 140px; max-width: 320px; background: var(--blanc); border: 1px solid var(--carter); padding: 4px; }
.sous-titre { margin: 24px 0 8px; font: 800 18px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }

.mesures-ligne { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; border: 1.5px solid var(--graphite); background: var(--blanc); }
.mesures-ligne div { padding: 10px 14px; border-right: 1px solid var(--process); }
.mesures-ligne div:last-child { border-right: 0; }
.mesures-ligne dt { font: 500 10px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.mesures-ligne dd { margin: 4px 0 0; font: 800 28px/1 var(--f-titre); font-stretch: 62%; }
.mesure-signal { background: var(--signal-clair); }
.mesure-signal dd { box-shadow: inset 0 -4px 0 var(--signal); display: inline-block; }

.repere-signal { background: var(--signal); }
.repere-signal dt { color: var(--graphite); }

.correspondance { margin-top: 12px; }
.tableau-seuils { margin-top: 16px; }
.jauge { position: relative; height: 12px; background: var(--process); border: 1px solid var(--carter); }
.jauge div { height: 100%; background: var(--acier); }
.jauge span { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed var(--graphite); }
.jauge-depasse { border-color: var(--graphite); }
.jauge-depasse div { background: var(--signal); }
.barre-masse { height: 10px; background: var(--process); }
.barre-masse div { height: 100%; background: var(--carter); }

.anomalies { margin-top: 16px; padding: 12px 16px; background: var(--blanc); border: 1px solid var(--carter); border-left: 4px solid var(--graphite); }
.anomalies .sous-titre { margin-top: 0; }
.anomalies ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

.fraicheur { margin: 0 0 12px; padding: 8px 12px; background: var(--blanc); border-left: 4px solid var(--graphite); font-weight: 600; }
.fraicheur-signal { border-left-color: var(--signal); background: var(--signal-clair); }

.barre-apercu { position: sticky; top: 56px; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 0; margin: -8px 0 16px; background: var(--process); border-bottom: 1.5px solid var(--graphite); }
.barre-apercu-titre { flex: 1; margin: 0; font: 800 22px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
@media print { .barre-apercu { display: none !important; } }

/* Autodiagnostic */
.chapitres-nav { display: flex; flex-wrap: wrap; gap: 0; border: 1.5px solid var(--graphite); background: var(--blanc); margin-bottom: 16px; }
.chapitres-nav button { flex: 1 1 160px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; background: none; border: 0; border-right: 1px solid var(--process); border-bottom: 1px solid var(--process); text-align: left; cursor: pointer; }
.chapitres-nav button:hover { background: var(--process); }
.chapitres-nav button.actif { background: var(--graphite); color: var(--releve); }
.chapitres-nav .data { font-size: 10px; color: inherit; opacity: .8; }
.question { padding: 14px 0 16px; border-bottom: 1px solid var(--process); }
.question-tete { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.question-ref { font: 500 10px var(--f-data); font-stretch: 87.5%; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); margin: 0 0 4px; }
.question-texte { margin: 0; font-weight: 600; font-size: 16px; max-width: 72ch; }
.question-aide { margin: 6px 0 0; font-size: 14px; color: var(--acier); max-width: 75ch; }
.question-preuves { margin: 8px 0 0; font-size: 13px; color: var(--acier); }
.question-preuves strong { font: 500 10px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); margin-right: 6px; }
.frequence { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 3px 8px; border: 1px solid var(--graphite); background: var(--releve); font: 500 11px var(--f-data); font-stretch: 87.5%; text-transform: uppercase; letter-spacing: .04em; }
.frequence-forte { background: var(--graphite); color: var(--releve); }
.frequence-rappel { border-style: dashed; color: var(--gris); }
.frequence-barre { width: 60px; height: 6px; background: var(--process); }
.frequence-barre div { height: 100%; background: var(--graphite); }
.question-nonConforme, .question-non { box-shadow: inset 4px 0 0 var(--signal); padding-left: 12px; }
.question-obs { margin-top: 10px; }
.seg-oui.actif { background: var(--graphite); }
.segments-reponse .seg-non.actif { background: var(--signal); color: var(--graphite); }
.score-chapitres { display: grid; gap: 6px; margin: 0; }
.score-chapitres div { display: grid; grid-template-columns: 220px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: 14px; }
.score-barre { height: 10px; background: var(--process); border: 1px solid var(--carter); }
.score-barre div { height: 100%; background: var(--acier); }

@media (max-width: 1000px) { .mesures-ligne { grid-template-columns: repeat(2, minmax(0, 1fr)); } .score-chapitres div { grid-template-columns: 1fr; gap: 4px; } }

/* Registre de l'arrêté préfectoral */
.ajout-arrete { border: 1px solid var(--carter); background: var(--process); padding: 16px; margin-bottom: 16px; }
.ajout-arrete textarea { width: 100%; font: 13px/1.5 var(--f-data); }
.sources { list-style: none; margin: 0; padding: 0; }
.sources li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--carter); }
.sources li .data { color: var(--gris); font-size: 13px; }
.sources li .btn { margin-left: auto; }
.tableau-registre td { vertical-align: top; }
.tableau-registre textarea { width: 100%; min-width: 260px; font: inherit; font-size: 13px; resize: vertical; }
.tableau-registre select, .tableau-registre input[type="date"], .tableau-registre input[type="text"] { width: 100%; min-width: 120px; margin-bottom: 4px; }
.ligne-a-valider td { background: var(--releve); }
.sous-ligne-haut { margin: 0 0 4px; font-weight: 600; color: var(--graphite); }
.echeance-depassee { font-weight: 700; box-shadow: inset 0 -3px 0 var(--signal); }
select.statut-non_conforme { border-color: var(--graphite); background: var(--signal-clair); font-weight: 700; }
select.statut-a_valider { font-style: italic; }

/* Classement Seveso */
.verdict-seveso { border: 1px solid var(--graphite); border-left-width: 6px; padding: 14px 16px; margin: 12px 0; background: var(--blanc); }
.verdict-bas, .verdict-haut { border-left-color: var(--signal); background: var(--signal-clair); }
.verdict-titre { margin: 0 0 4px; font: 800 26px/1.05 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.verdict-seveso .mesures-ligne { margin-top: 12px; }
.jauge-cumul { position: relative; display: block; height: 8px; margin-top: 6px; background: var(--process); border: 1px solid var(--carter); }
.jauge-cumul span { display: block; height: 100%; background: var(--acier); }
.jauge-cumul.jauge-depasse span { background: var(--signal); }
.jauge-cumul i { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px solid var(--graphite); }
.rangee-filtre select { width: auto; min-height: 36px; }
.tableau-registre td:nth-child(2) { min-width: 280px; }
.defile { overflow-x: auto; }
.tableau-registre textarea { min-width: 240px; }
.tableau-registre select, .tableau-registre input[type="date"], .tableau-registre input[type="text"] { min-width: 0; }
.tableau-registre select[aria-label="Statut"] { min-width: 136px; }
.tableau-registre td:nth-child(4) { width: 150px; }
.tableau-registre td:nth-child(5) { width: 120px; }
/* Registre à 1366 px : colonnes fixes, la prescription prend le reste. */
.tableau-registre { table-layout: fixed; width: 100%; min-width: 1000px; }
.tableau-registre th:nth-child(1) { width: 44px; }
.tableau-registre th:nth-child(3) { width: 132px; }
.tableau-registre th:nth-child(4) { width: 132px; }
.tableau-registre th:nth-child(5) { width: 96px; }
.tableau-registre th:nth-child(6) { width: 140px; }
.tableau-registre th:nth-child(7) { width: 160px; }
.tableau-registre th:nth-child(8) { width: 72px; }
.tableau-registre td:nth-child(2) { min-width: 0; }
.tableau-registre textarea { min-width: 0; }
.tableau-registre select[aria-label="Statut"] { min-width: 0; }

.gratuit { max-width: 1180px; }
.intro { margin: 8px 0 24px; }
.intro h1 { margin: 0 0 8px; font: 800 56px/0.92 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.intro p { margin: 0; max-width: 80ch; font-size: 16px; }
.offre { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin: 24px 0 8px; padding: 20px 24px; background: var(--graphite); color: var(--releve); }
.offre h2 { margin: 0 0 6px; font: 800 30px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.offre p { margin: 0; max-width: 75ch; color: var(--process); }
.offre .verdict-etiquette { color: var(--carter); margin-bottom: 6px; }
.offre .btn-principal { background: var(--releve); color: var(--graphite); border-color: var(--releve); text-decoration: none; }
a.btn { text-decoration: none; }
.gratuit .suite { display: none; }
@media (max-width: 800px) { .offre { flex-direction: column; align-items: flex-start; } .intro h1 { font-size: 40px; } }
@media print { .offre, .gratuit .panneau-actions, .equipement .btn { display: none !important; } .gratuit .panneau { display: block !important; } }

/* Visite 1510 : page publique */
.intro .verdict-etiquette { margin: 0 0 10px; }
.chiffres-intro { display: grid; grid-template-columns: repeat(4, 1fr); margin: 24px 0 0; border: 1.5px solid var(--graphite); background: var(--blanc); }
.chiffres-intro div { padding: 12px 16px; border-right: 1px solid var(--carter); }
.chiffres-intro div:last-child { border-right: 0; }
.chiffres-intro dt { font: 500 11px var(--f-data); text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.chiffres-intro dd { margin: 4px 0 0; font: 800 44px/1 var(--f-titre); font-stretch: 62%; }
.chiffres-intro .chiffre-signal { background: var(--signal); }
.chiffres-intro .chiffre-signal dt { color: var(--graphite); }
.bloc { margin: 40px 0 0; }
.bloc > h2 { margin: 0 0 4px; font: 800 34px/1 var(--f-titre); font-stretch: 62%; text-transform: uppercase; }
.bloc-sous { margin: 0 0 16px; color: var(--gris); max-width: 85ch; }
.ecarts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.ecart { background: var(--blanc); border: 1px solid var(--graphite); padding: 16px 18px; }
.ecart header { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.ecart-rang { font-size: 13px; padding: 2px 6px; border: 1px solid var(--graphite); }
.ecart-ref { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
.ecart h3 { margin: 2px 0 0; font-size: 17px; line-height: 1.25; }
.ecart-taux { margin: 0; text-align: right; }
.ecart-taux strong { display: block; font: 800 34px/1 var(--f-titre); font-stretch: 62%; }
.ecart-taux span { font: 500 11px var(--f-data); text-transform: uppercase; color: var(--gris); }
.ecart-barre { height: 6px; margin: 12px 0 6px; background: var(--process); border: 1px solid var(--carter); }
.ecart-barre span { display: block; height: 100%; background: var(--graphite); }
.ecart:first-child .ecart-barre span { background: var(--signal); }
.ecart-chiffres { margin: 0 0 10px; font-size: 12px; color: var(--gris); }
.ecart-exemples { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; }
.ecart-exemples li { padding: 6px 0 6px 10px; border-left: 2px solid var(--carter); margin-bottom: 6px; font-style: italic; }
.ecart-exemples .data { display: block; font-style: normal; font-size: 11px; color: var(--gris); margin-top: 2px; }
.ecart-preuves { margin: 0; font-size: 13px; color: var(--acier); }
.mini { list-style: none; counter-reset: q; margin: 0; padding: 0; background: var(--blanc); border: 1px solid var(--graphite); }
.mini li { counter-increment: q; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 12px 16px 12px 52px; border-bottom: 1px solid var(--carter); position: relative; }
.mini li::before { content: counter(q, decimal-leading-zero); position: absolute; left: 16px; top: 14px; font: 500 13px var(--f-data); color: var(--gris); }
.mini li:last-child { border-bottom: 0; }
.mini-q { margin: 0; font-weight: 600; }
.mini-aide { margin: 2px 0 0; font-size: 13px; color: var(--gris); max-width: 75ch; }
.mini-resultat { margin-top: 12px; padding: 16px; border: 1.5px solid var(--graphite); background: var(--process); }
.mini-resultat p { margin: 0; }
.mini-score { font-size: 16px; margin-bottom: 8px !important; }
.mini-actions { margin: 8px 0 0; padding-left: 20px; }
.mini-actions li { margin-bottom: 6px; }
.express { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
.express .tableau { background: var(--blanc); }
.express .verdict-seveso { margin: 0; position: sticky; top: 16px; }
.methode ul { padding-left: 20px; max-width: 95ch; }
.methode li { margin-bottom: 6px; }
@media (max-width: 900px) { .ecarts, .express { grid-template-columns: 1fr; } .chiffres-intro { grid-template-columns: repeat(2, 1fr); } .mini li { grid-template-columns: 1fr; } }
</style>

res":"3.3","3.4-issues":"3.4","25-surveillance":"25","4-construction":"4","5-desenfumage":"5","6-murs":"6","7-cellules":"7","17-charge":"17","18-chauffage":"18","8-incompatibles":"8","9-hauteurs":"9","9-liquides":"9","27-froid":"27","28-liquides":"28","10-retentions":"10","11-confinement":"11","1.6-reseaux":"1.6","1.7-dechets":"1.7","24-bruit":"24","12-detection":"12","13-eau":"13","13-moyens":"13","13-exercice":"13","22-maintenance":"22","23-pdi":"23","1.5-prelevements":"1.5","15-electricite":"15","20-travaux":"20","21-consignes":"21","14-evacuation":"14","13-formation":"13"}};var V={verifie_le:"2026-10-24",texte:"Arr\xEAt\xE9 du 11 avril 2017, annexe II, version consolid\xE9e apr\xE8s l'arr\xEAt\xE9 du 24 septembre 2020",chapitres:[{id:"documents",titre:"Dossier et \xE9tat des stocks",court:"Dossier"},{id:"acces",titre:"Implantation, acc\xE8s des secours, surveillance",court:"Acc\xE8s"},{id:"construction",titre:"Construction, compartimentage, d\xE9senfumage",court:"Construction"},{id:"stockage",titre:"Conditions de stockage",court:"Stockage"},{id:"eaux",titre:"Eaux, r\xE9tentions, d\xE9chets",court:"Eaux"},{id:"incendie",titre:"D\xE9tection, lutte contre l'incendie, plan de d\xE9fense",court:"Incendie"},{id:"exploitation",titre:"\xC9lectricit\xE9, travaux, consignes, personnel",court:"Exploitation"}],points:[{id:"1.2-dossier",point:"1.2",chapitre:"documents",gravite:1,titre:"Dossier de l'installation",question:"Le dossier de l'installation est-il complet, dat\xE9 et \xE0 jour ?",aide:"Demande ou d\xE9claration et ses pi\xE8ces, preuve de d\xE9p\xF4t ou arr\xEAt\xE9 d'enregistrement ou d'autorisation, arr\xEAt\xE9s pr\xE9fectoraux, justificatifs exig\xE9s par l'arr\xEAt\xE9 (notamment ceux des points 4, 12 et 13), rapports de visite des assureurs et leurs recommandations.",preuves:["Dossier de l'installation (classeur ou GED) avec sommaire dat\xE9","Arr\xEAt\xE9s pr\xE9fectoraux et r\xE9c\xE9piss\xE9s","Rapports de visite de risques des assureurs"]},{id:"1.1-conformite",point:"1.1",chapitre:"documents",gravite:2,titre:"Site conforme aux plans du dossier",question:"L'entrep\xF4t correspond-il aux plans et au dossier d\xE9pos\xE9s (cellules, usages, volumes, rubriques) ?",aide:"Toute modification notable (nouvelle cellule, changement d'usage, nouvelle rubrique, hausse des quantit\xE9s) doit avoir \xE9t\xE9 port\xE9e \xE0 la connaissance du pr\xE9fet avant sa r\xE9alisation.",preuves:["Plans du dossier compar\xE9s \xE0 l'\xE9tat r\xE9el","Porter \xE0 connaissance des modifications"]},{id:"1.4-etat",point:"1.4",chapitre:"documents",gravite:3,titre:"\xC9tat des mati\xE8res stock\xE9es",question:"Tenez-vous un \xE9tat des mati\xE8res stock\xE9es par zone, avec les familles de mentions de danger et un plan g\xE9n\xE9ral des zones, accessible \xE0 tout moment ?",aide:"R\xE9gimes E et A : mise \xE0 jour au moins hebdomadaire, quotidienne pour les mati\xE8res dangereuses et les cellules de liquides combustibles. L'\xE9tat doit pouvoir \xEAtre consult\xE9 \xE0 tout moment, y compris par les secours, m\xEAme en cas de sinistre (copie hors du b\xE2timent). Lors de l'action nationale 2026, les inspecteurs ont relev\xE9 des \xE9tats sans familles de danger, sans d\xE9coupage par zone, ou non exploitables par les pouvoirs publics.",preuves:["\xC9tat des stocks dat\xE9 du jour, \xE9tabli depuis l'export du logiciel d'entrep\xF4t","Plan g\xE9n\xE9ral des zones de stockage","Historique des mises \xE0 jour"],lienModule:"stocks"},{id:"1.4-public",point:"1.4",chapitre:"documents",gravite:2,titre:"Synth\xE8se de l'\xE9tat des stocks pour le public",question:"Disposez-vous d'une version synth\xE9tique de l'\xE9tat des stocks, par b\xE2timent, destin\xE9e \xE0 l'information du public ?",aide:"Lors de l'action nationale 2026, une synth\xE8se globale au lieu d'une synth\xE8se par b\xE2timent a donn\xE9 lieu \xE0 une demande d'action corrective.",preuves:["Synth\xE8se pour le public dat\xE9e, tenue \xE0 disposition"],regimes:["A","E"],lienModule:"stocks"},{id:"1.4-inventaire",point:"1.4",chapitre:"documents",gravite:1,titre:"Inventaire physique annuel",question:"Un inventaire physique des stocks est-il r\xE9alis\xE9 au moins une fois par an ?",aide:"Exig\xE9 pour les r\xE9gimes E et A, en compl\xE9ment de l'\xE9tat tenu par le logiciel.",preuves:["Compte rendu ou proc\xE8s-verbal du dernier inventaire"],regimes:["A","E"]},{id:"1.4-fds",point:"1.4",chapitre:"documents",gravite:2,titre:"Fiches de donn\xE9es de s\xE9curit\xE9",question:"Les fiches de donn\xE9es de s\xE9curit\xE9 de toutes les mati\xE8res dangereuses sont-elles disponibles sur le site avant leur r\xE9ception ?",aide:"Elles doivent \xEAtre accessibles aux services d'incendie et de secours et \xE0 l'inspection. Le plan de d\xE9fense incendie pr\xE9cise comment elles sont mises \xE0 disposition.",preuves:["Classement des FDS (papier ou num\xE9rique accessible hors r\xE9seau)","Proc\xE9dure d'accueil d'un nouveau produit dangereux"]},{id:"1.8-controle",point:"1.8.1",chapitre:"documents",gravite:2,titre:"Contr\xF4le p\xE9riodique (d\xE9claration)",question:"Le contr\xF4le p\xE9riodique par un organisme agr\xE9\xE9 est-il fait dans le d\xE9lai r\xE9glementaire (5 ans, 10 ans pour un site certifi\xE9 ISO 14001 ou EMAS), et ses non-conformit\xE9s ont-elles un \xE9ch\xE9ancier d'actions ?",aide:"Installations soumises \xE0 d\xE9claration avec contr\xF4le (DC) : contr\xF4le par un organisme agr\xE9\xE9 sur les points de l'annexe III. Les non-conformit\xE9s majeures non corrig\xE9es sont signal\xE9es au pr\xE9fet.",preuves:["Dernier rapport de contr\xF4le p\xE9riodique","\xC9ch\xE9ancier des actions correctives avec dates de r\xE9alisation"],regimes:["DC"]},{id:"3.5-documents-secours",point:"3.5",chapitre:"documents",gravite:2,titre:"Documents pour les secours",question:"Les plans des locaux (dangers de chaque local \xE0 risques, moyens de protection) et les consignes d'acc\xE8s des secours sont-ils pr\xEAts et annex\xE9s au plan de d\xE9fense incendie ?",aide:"Leur absence a d\xE9j\xE0 donn\xE9 lieu \xE0 une proposition de mise en demeure.",preuves:["Plans d'intervention \xE0 jour","Consignes d'acc\xE8s des secours"]},{id:"2-distances",point:"2",chapitre:"acces",gravite:2,titre:"Distances d'isolement et flux thermiques",question:"Disposez-vous d'une \xE9tude des flux thermiques (FLUMILOG ou \xE9tude sp\xE9cifique) \xE0 jour, coh\xE9rente avec les stocks et les cellules actuels ?",aide:"E et A : effets l\xE9taux (5 kW/m\xB2) hors des tiers et des voies non n\xE9cessaires ; effets irr\xE9versibles (3 kW/m\xB2) hors des ERP et grandes voies ; 8 kW/m\xB2 dans le site pour les dossiers d\xE9pos\xE9s apr\xE8s le 1er janvier 2021. Parois \xE0 20 m au moins de l'enceinte, sauf dispositif E120. DC : 1,5 fois la hauteur, 20 m minimum.",preuves:["Notes de calcul et cartographies FLUMILOG","Plan de masse cot\xE9"]},{id:"2-exterieur",point:"2.III",chapitre:"acces",gravite:2,titre:"Stockages ext\xE9rieurs et stationnements",question:"Les stockages ext\xE9rieurs (palettes, bennes, emballages) et les stationnements de remorques sont-ils \xE0 10 m au moins des parois des cellules ?",aide:"Distance r\xE9duite \xE0 1 m si la paroi est REI 120 et d\xE9passe de 2 m la hauteur du stockage, ou si le stockage ext\xE9rieur est prot\xE9g\xE9 par une extinction ou un refroidissement automatique. Applicable aux entrep\xF4ts existants depuis le 1er janvier 2025.",preuves:["Plan des zones ext\xE9rieures cot\xE9es","Photos dat\xE9es"]},{id:"3.1-acces",point:"3.1",chapitre:"acces",gravite:2,titre:"Acc\xE8s des secours au site",question:"Les secours peuvent-ils entrer \xE0 tout moment, portail ouvrable imm\xE9diatement, sans g\xEAne par les v\xE9hicules ?",aide:"\xC0 d\xE9faut d'acc\xE8s d\xE9gag\xE9 en permanence, les mesures pour le d\xE9gager avant l'arriv\xE9e des secours figurent au plan de d\xE9fense incendie.",preuves:["Proc\xE9dure d'ouverture du portail (dans le PDI)","Information du SDIS sur les acc\xE8s"]},{id:"3.2-voie",point:"3.2",chapitre:"acces",gravite:2,titre:"Voie engins",question:"La voie engins (6 m de large, 4,5 m de hauteur libre, \xE0 moins de 60 m de tout point du p\xE9rim\xE8tre) est-elle maintenue d\xE9gag\xE9e, sans stationnement ni stockage ?",aide:"Pente inf\xE9rieure \xE0 15 %, rayon int\xE9rieur de 13 m, force portante de 320 kN. En impasse : 7 m de large sur les 40 derniers m\xE8tres et aire de retournement de 20 m.",preuves:["Plan de masse avec la voie engins","Marquage et signalisation d'interdiction de stationner"],nouveauSeulement:!0},{id:"3.3-aires",point:"3.3",chapitre:"acces",gravite:1,titre:"Aires de mise en station et de stationnement des engins",question:"Les aires de mise en station des moyens a\xE9riens et de stationnement des engins existent-elles, marqu\xE9es au sol et d\xE9gag\xE9es ?",aide:"Aire de mise en station : 7 \xD7 10 m au moins, entre 1 et 8 m de la fa\xE7ade, hors des flux de plus de 5 kW/m\xB2. Aire de stationnement : 4 \xD7 8 m, \xE0 moins de 5 m du point d'eau.",preuves:["Plan de masse","Photos du marquage"],nouveauSeulement:!0},{id:"3.4-issues",point:"3.4",chapitre:"acces",gravite:1,titre:"Acc\xE8s aux issues et aux quais",question:"Un chemin stabilis\xE9 de 1,8 m relie-t-il la voie engins aux issues, et les quais ont-ils une rampe d\xE9vidoir ?",aide:"Acc\xE8s aux cellules de 1,8 m de large ; rampe de 1,8 m de large et de pente inf\xE9rieure \xE0 10 % sauf acc\xE8s de plain-pied.",preuves:["Plan","Constat sur place"],nouveauSeulement:!0},{id:"25-surveillance",point:"25",chapitre:"acces",gravite:3,titre:"Surveillance et contr\xF4le des acc\xE8s",question:"Hors des heures d'exploitation, une surveillance permanente (gardiennage ou t\xE9l\xE9surveillance) permet-elle l'alerte et l'accueil des secours, et l'entrep\xF4t est-il ferm\xE9 aux personnes \xE9trang\xE8res ?",aide:"Cl\xF4ture continue, contr\xF4le des acc\xE8s, lev\xE9e de doute et acc\xE8s des secours \xE0 tous les lieux. Une cl\xF4ture ouverte ou l'absence de t\xE9l\xE9surveillance sont relev\xE9es en inspection ; c'est une non-conformit\xE9 majeure au contr\xF4le p\xE9riodique.",preuves:["Contrat de t\xE9l\xE9surveillance ou de gardiennage","Proc\xE9dure d'alerte hors heures ouvr\xE9es","Plan de la cl\xF4ture et des acc\xE8s"]},{id:"4-construction",point:"4",chapitre:"construction",gravite:2,titre:"Dispositions constructives et justificatifs",question:"Avez-vous au dossier les justificatifs de comportement au feu (structure R 15 au moins, couverture BROOF (t3), isolant, parois, locaux REI 120) ?",aide:"PV de classement, attestations de conformit\xE9, notice de s\xE9curit\xE9. Bureaux et locaux sociaux \xE0 10 m des cellules ou s\xE9par\xE9s par des parois et un plafond REI 120 ; locaux de maintenance REI 120 avec portes EI2 120 C.",preuves:["PV de r\xE9sistance et de r\xE9action au feu","Attestation de non-ruine en cha\xEEne si exig\xE9e","Dossier des ouvrages ex\xE9cut\xE9s (DOE)"]},{id:"5-desenfumage",point:"5",chapitre:"construction",gravite:3,titre:"D\xE9senfumage",question:"Les cantons (1 650 m\xB2 et 60 m au plus) sont-ils d\xE9limit\xE9s par des \xE9crans stables au feu, et les exutoires \xE0 commande automatique et manuelle sont-ils v\xE9rifi\xE9s et en \xE9tat ?",aide:"Surface utile d'exutoires d'au moins 2 % du canton, 4 exutoires pour 1 000 m\xB2, commandes manuelles en deux points oppos\xE9s, amen\xE9es d'air frais. L'absence d'\xE9cran de cantonnement a d\xE9j\xE0 conduit \xE0 une mise en demeure.",preuves:["Plan de cantonnement et d'exutoires","Dernier rapport de v\xE9rification du d\xE9senfumage, sans r\xE9serve ouverte"]},{id:"6-murs",point:"6",chapitre:"construction",gravite:3,titre:"Murs et portes coupe-feu",question:"Les murs s\xE9paratifs REI 120 sont-ils intacts (aucun percement non rebouch\xE9) et les portes coupe-feu se ferment-elles automatiquement sans obstacle ?",aide:"Parois d\xE9passant d'au moins 1 m la couverture, bande de protection de 5 m de part et d'autre, portes EI2 120 C \xE0 fermeture automatique. Un obstacle \xE0 la fermeture est une non-conformit\xE9 majeure au contr\xF4le p\xE9riodique.",preuves:["PV des murs et portes","Rapport de v\xE9rification des portes coupe-feu","Contr\xF4le visuel des travers\xE9es et des zones de fermeture"]},{id:"7-cellules",point:"7",chapitre:"construction",gravite:2,titre:"Dimensions des cellules",question:"Les cellules respectent-elles 3 000 m\xB2 sans extinction automatique (12 000 m\xB2 avec) et 23 m de hauteur, et les mezzanines 50 % de la surface de la cellule ?",aide:"Les d\xE9rogations (cellules plus grandes ou plus hautes) supposent une \xE9tude et une extinction automatique capable seule de ma\xEEtriser l'incendie. Mezzanines jusqu'\xE0 85 % pour le textile.",preuves:["Plans des cellules","\xC9tude d'ing\xE9nierie incendie si d\xE9rogation"]},{id:"17-charge",point:"17",chapitre:"construction",gravite:2,titre:"Charge des batteries",question:"La recharge des chariots se fait-elle dans un local d\xE9di\xE9 (REI 120, ventil\xE9) ou dans une zone de recharge \xE0 3 m de tout combustible ?",aide:"Recharge interdite hors des locaux d\xE9di\xE9s en cas de risque d'\xE9manations. Clapets coupe-feu aux travers\xE9es des parois s\xE9paratives.",preuves:["Plan du local ou des zones de charge","PV coupe-feu","V\xE9rification de la ventilation"]},{id:"18-chauffage",point:"18",chapitre:"construction",gravite:1,titre:"Chauffage",question:"La chaufferie est-elle isol\xE9e (REI 120) avec vanne de coupure et arr\xEAt d'urgence \xE0 l'ext\xE9rieur, et les a\xE9rothermes gaz \xE0 2 m des combustibles ?",aide:"A\xE9rothermes gaz admis en circuit ferm\xE9, tuyauterie gaz ext\xE9rieure, deux vannes automatiques, surfaces \xE0 moins de 120 \xB0C.",preuves:["Plans","Rapports de v\xE9rification des installations de chauffage"],sansObjet:"Pas de chauffage"},{id:"8-incompatibles",point:"8",chapitre:"stockage",gravite:3,titre:"Mati\xE8res dangereuses et incompatibles",question:"Les mati\xE8res dangereuses sont-elles stock\xE9es dans des cellules d\xE9di\xE9es de plain-pied, et les produits incompatibles s\xE9par\xE9s ?",aide:"Pas de niveau au-dessus ni de mezzanine dans ces cellules. Les zones de pr\xE9paration et de r\xE9ception ne sont pas concern\xE9es.",preuves:["Plan de stockage par zone","Matrice d'incompatibilit\xE9s","\xC9tat des stocks par famille de danger"],sansObjet:"Aucune mati\xE8re dangereuse stock\xE9e"},{id:"9-hauteurs",point:"9",chapitre:"stockage",gravite:3,titre:"Hauteurs, \xEElots et all\xE9es",question:"Les hauteurs de stockage, la surface des \xEElots en masse (500 m\xB2, 8 m) et les all\xE9es de 2 m sont-elles respect\xE9es partout, y compris en p\xE9riode de pointe ?",aide:"Racks sans extinction automatique : 10 m. Liquides dangereux : 5 m. Distance libre sous la toiture et les \xE9clairages. Des \xEElots de plus de 500 m\xB2 et des all\xE9es encombr\xE9es ont conduit \xE0 des mises en demeure.",preuves:["Plan d'implantation des stocks","Contr\xF4les internes dat\xE9s (photos)","Consigne de hauteur affich\xE9e"]},{id:"9-liquides",point:"9",chapitre:"stockage",gravite:3,titre:"Liquides inflammables en contenants fusibles",question:"Avez-vous supprim\xE9 les liquides H224 en contenants fusibles de plus de 30 L, et les liquides H225 en contenants fusibles au-del\xE0 des volumes autoris\xE9s depuis le 1er janvier 2026 ?",aide:"H225 non miscibles \xE0 l'eau : interdits au-del\xE0 de 30 L ; miscibles : au-del\xE0 de 230 L, sauf protection test\xE9e selon un protocole reconnu. Armoire REI 120 possible jusqu'\xE0 2 m\xB3.",preuves:["\xC9tat des stocks avec mentions de danger et volume des contenants","Attestation de l'extinction adapt\xE9e si protection test\xE9e"],sansObjet:"Aucun liquide inflammable"},{id:"27-froid",point:"27",chapitre:"stockage",gravite:2,titre:"Cellules frigorifiques",question:"Les cellules frigorifiques respectent-elles les r\xE8gles de d\xE9tection, de stockage et de d\xE9senfumage du point 27 (test annuel de la d\xE9tection haute sensibilit\xE9, combles vides, d\xE9tecteurs de gaz frigorig\xE8ne) ?",aide:"D\xE9tection dans les combles avec transmission de l'alarme ; en froid n\xE9gatif sans extinction, cellule de 4 500 m\xB2 au plus avec d\xE9tection haute sensibilit\xE9 test\xE9e chaque ann\xE9e.",preuves:["Rapports de test annuels","Rapports de v\xE9rification des d\xE9tecteurs de gaz"],sansObjet:"Pas de cellule frigorifique",nouveauSeulement:!0},{id:"28-liquides",point:"28",chapitre:"stockage",gravite:2,titre:"Cellules de liquides et solides liqu\xE9fiables combustibles",question:"Les cellules de liquides combustibles disposent-elles d'une extinction adapt\xE9e avec attestation, de zones de collecte de 1 000 m\xB2 au plus et d'un drainage test\xE9 tous les 6 mois ?",aide:"Applicable aux dossiers d\xE9pos\xE9s apr\xE8s le 1er juillet 2021 et, dans les conditions qu'il pr\xE9voit, aux entrep\xF4ts existants.",preuves:["Attestation de conformit\xE9 de l'extinction","Registre des tests semestriels du drainage"],sansObjet:"Pas de cellule de liquides combustibles"},{id:"10-retentions",point:"10",chapitre:"eaux",gravite:2,titre:"R\xE9tentions",question:"Les liquides susceptibles de polluer sont-ils sur r\xE9tention correctement dimensionn\xE9e, sans produits incompatibles dans la m\xEAme r\xE9tention ?",aide:"Au moins 100 % du plus grand r\xE9servoir ou 50 % de la capacit\xE9 totale ; pour les contenants de 250 L ou moins : 20 % de la capacit\xE9 totale, 800 L minimum (ou la capacit\xE9 totale si elle est inf\xE9rieure \xE0 800 L).",preuves:["Note de dimensionnement des r\xE9tentions","Constat d'\xE9tanch\xE9it\xE9"],sansObjet:"Aucun liquide polluant"},{id:"11-confinement",point:"11",chapitre:"eaux",gravite:3,titre:"Confinement des eaux d'extinction",question:"Le volume de confinement des eaux d'extinction est-il justifi\xE9 (calcul D9A) et le bassin \xE9tanche, avec des vannes signal\xE9es, test\xE9es et man\u0153uvrables sur place et \xE0 distance ?",aide:"Confinement interne interdit si des mati\xE8res dangereuses sont stock\xE9es. Un bassin non \xE9tanche ou des vannes sans consigne ont conduit \xE0 des mises en demeure.",preuves:["Note de calcul D9A","Plan du bassin et des vannes d'isolement","Comptes rendus de test des vannes","Consigne de man\u0153uvre"]},{id:"1.6-reseaux",point:"1.6",chapitre:"eaux",gravite:1,titre:"Plan des r\xE9seaux et s\xE9parateur",question:"Le plan dat\xE9 des r\xE9seaux est-il \xE0 jour et annex\xE9 au PDI, et le s\xE9parateur d'hydrocarbures est-il entretenu et contr\xF4l\xE9 chaque ann\xE9e ?",aide:"Disconnecteur v\xE9rifi\xE9 au moins une fois par an. Rejets d'eaux pluviales : hydrocarbures < 10 mg/l, MES < 100 mg/l, DCO < 300 mg/l.",preuves:["Plan des r\xE9seaux dat\xE9","Rapports d'entretien et de curage du s\xE9parateur","Contr\xF4le annuel du disconnecteur"]},{id:"1.7-dechets",point:"1.7",chapitre:"eaux",gravite:1,titre:"D\xE9chets",question:"Les d\xE9chets sont-ils stock\xE9s sans risque (d\xE9chets dangereux sur r\xE9tention) et suivis par un registre et des bordereaux ?",aide:"Registre des d\xE9chets dangereux, bordereaux de suivi (Trackd\xE9chets), aucun br\xFBlage \xE0 l'air libre. Les d\xE9chets entrent aussi dans l'\xE9tat des stocks.",preuves:["Registre des d\xE9chets","Bordereaux de suivi"]},{id:"24-bruit",point:"24",chapitre:"eaux",gravite:1,titre:"Bruit",question:"Une mesure des niveaux sonores en limite de propri\xE9t\xE9 a-t-elle \xE9t\xE9 r\xE9alis\xE9e et montre-t-elle le respect des valeurs, de jour comme de nuit ?",aide:"Une non-conformit\xE9 de nuit en limite de propri\xE9t\xE9, sans action engag\xE9e, a \xE9t\xE9 relev\xE9e en inspection.",preuves:["Dernier rapport de mesure acoustique"]},{id:"12-detection",point:"12",chapitre:"incendie",gravite:3,titre:"D\xE9tection automatique d'incendie",question:"Chaque cellule, local technique et bureau proche des stockages a-t-il une d\xE9tection automatique avec transmission permanente de l'alarme, v\xE9rifi\xE9e et justifi\xE9e ?",aide:"Alarme audible en tout point, d\xE9clenchement du compartimentage. R\xE9gimes E et A : justification du dimensionnement au dossier. Les mezzanines ont une d\xE9tection d\xE9di\xE9e.",preuves:["Note de justification de la d\xE9tection","Rapport de v\xE9rification du SSI","Contrat de t\xE9l\xE9transmission de l'alarme"]},{id:"13-eau",point:"13",chapitre:"incendie",gravite:3,titre:"D\xE9fense ext\xE9rieure contre l'incendie",question:"Les besoins en eau (calcul D9) sont-ils couverts, avec des poteaux ou r\xE9serves \xE0 moins de 100 m de chaque cellule et une mesure r\xE9cente du d\xE9bit ?",aide:"D\xE9bit plafonn\xE9 \xE0 720 m\xB3/h pendant 2 h ; chaque point d'eau donne au moins 60 m\xB3/h pendant 2 h. Points d'eau espac\xE9s de 150 m au plus.",preuves:["Note de calcul D9","Attestation de d\xE9bit et de pression des poteaux","Plan des points d'eau"]},{id:"13-moyens",point:"13",chapitre:"incendie",gravite:2,titre:"Extincteurs, RIA et extinction automatique",question:"Extincteurs, RIA et extinction automatique sont-ils en place, v\xE9rifi\xE9s dans les d\xE9lais et sans r\xE9serve ouverte ?",aide:"RIA pr\xE8s des issues, deux lances sur chaque foyer, utilisables par temps de gel. Extinction automatique con\xE7ue et entretenue selon un r\xE9f\xE9rentiel reconnu et qualifi\xE9e par un organisme comp\xE9tent.",preuves:["Rapports de v\xE9rification des extincteurs et des RIA","Certificat et rapports de v\xE9rification de l'extinction automatique"]},{id:"13-exercice",point:"13",chapitre:"incendie",gravite:2,titre:"Exercice de d\xE9fense incendie",question:"Un exercice de d\xE9fense incendie a-t-il eu lieu depuis moins de 3 ans, avec un compte rendu conserv\xE9 ?",aide:"R\xE9gimes E et A : dans le trimestre qui suit la mise en service, puis au moins tous les 3 ans ; compte rendu conserv\xE9 4 ans.",preuves:["Compte rendu du dernier exercice"],regimes:["A","E"]},{id:"22-maintenance",point:"22",chapitre:"incendie",gravite:3,titre:"Maintenance et registre des v\xE9rifications",question:"Les v\xE9rifications p\xE9riodiques des mat\xE9riels de s\xE9curit\xE9 (d\xE9senfumage, d\xE9tection, extinction, portes coupe-feu, \xE9lectricit\xE9, chauffage) sont-elles inscrites sur un registre, et les anomalies lev\xE9es ?",aide:"C'est l'un des \xE9carts les plus relev\xE9s : v\xE9rifications faites mais justificatifs absents, ou anomalies non lev\xE9es. Les mesures en cas d'indisponibilit\xE9 de l'extinction automatique figurent au plan de d\xE9fense incendie.",preuves:["Registre des v\xE9rifications p\xE9riodiques","Suivi de lev\xE9e des r\xE9serves","Proc\xE9dure \xAB extinction hors service \xBB"]},{id:"23-pdi",point:"23",chapitre:"incendie",gravite:3,titre:"Plan de d\xE9fense incendie",question:"Le plan de d\xE9fense incendie existe-t-il, est-il complet et \xE0 jour, et a-t-il \xE9t\xE9 transmis au SDIS ?",aide:"Obligatoire pour tous les entrep\xF4ts depuis le 31 d\xE9cembre 2023. Il comprend : alarme et alerte, premi\xE8re intervention et \xE9vacuation, accueil des secours en heures ouvr\xE9es et non ouvr\xE9es, comp\xE9tences du personnel, plans (cellules, murs, r\xE9seaux, points d'eau, vannes), extinction automatique, commandes de d\xE9senfumage, mise \xE0 disposition des FDS, mesures en cas d'indisponibilit\xE9 de l'extinction. Des PDI absents, incomplets ou incoh\xE9rents sont souvent relev\xE9s.",preuves:["PDI dat\xE9 et ses annexes","Preuve de transmission au SDIS"]},{id:"1.5-prelevements",point:"1.5",chapitre:"incendie",gravite:1,titre:"Pr\xE9l\xE8vements apr\xE8s incendie",question:"Savez-vous comment r\xE9aliser les premiers pr\xE9l\xE8vements dans l'air, les sols et les eaux apr\xE8s un incendie (mat\xE9riel, prestataire, proc\xE9dure) ?",aide:"R\xE9gime A : moyens et contrats d\xE9crits dans le plan de d\xE9fense incendie depuis le 1er janvier 2022. Tous r\xE9gimes : diagnostic des impacts apr\xE8s incendie.",preuves:["Proc\xE9dure de pr\xE9l\xE8vement","Contrat avec un laboratoire ou un prestataire"]},{id:"15-electricite",point:"15",chapitre:"exploitation",gravite:2,titre:"Installations \xE9lectriques et foudre",question:"Le rapport de v\xE9rification \xE9lectrique est-il r\xE9cent et ses observations lev\xE9es, et l'analyse du risque foudre est-elle faite et suivie ?",aide:"Interrupteur central signal\xE9 pr\xE8s d'une issue. \xC9quipements m\xE9talliques mis \xE0 la terre. Transformateurs en local REI 120. Photovolta\xEFque soumis \xE0 l'arr\xEAt\xE9 du 4 octobre 2010.",preuves:["Rapport de v\xE9rification \xE9lectrique et suivi des observations","Analyse du risque foudre, \xE9tude technique et v\xE9rifications"]},{id:"20-travaux",point:"20",chapitre:"exploitation",gravite:2,titre:"Travaux et permis de feu",question:"Les travaux par points chauds font-ils l'objet d'un permis de feu, et l'interdiction d'apporter du feu est-elle respect\xE9e (aucune zone fumeur dans les cellules) ?",aide:"Plan de pr\xE9vention avec les entreprises ext\xE9rieures, v\xE9rification trac\xE9e de la fin des travaux.",preuves:["Permis de feu et plans de pr\xE9vention sign\xE9s","Affichage de l'interdiction"]},{id:"21-consignes",point:"21",chapitre:"exploitation",gravite:2,titre:"Consignes",question:"Les consignes \xE9crites (interdiction de feu, arr\xEAt d'urgence, fuites, isolement des r\xE9seaux, moyens d'incendie, alerte avec num\xE9ros) sont-elles \xE0 jour et affich\xE9es dans toutes les cellules ?",aide:"Des consignes pr\xE9sentes dans une partie des cellules seulement, ou incompl\xE8tes, sont relev\xE9es en inspection.",preuves:["Consignes affich\xE9es, dat\xE9es","Liste des num\xE9ros d'urgence \xE0 jour"]},{id:"14-evacuation",point:"14",chapitre:"exploitation",gravite:1,titre:"\xC9vacuation et exercices",question:"Les issues sont-elles d\xE9gag\xE9es (75 m au plus d'un espace prot\xE9g\xE9, 2 issues oppos\xE9es par cellule de plus de 1 000 m\xB2) et un exercice d'\xE9vacuation a-t-il lieu tous les 6 mois ?",aide:"Issues non verrouill\xE9es en pr\xE9sence de personnel.",preuves:["Plans d'\xE9vacuation","Comptes rendus des exercices d'\xE9vacuation semestriels"]},{id:"13-formation",point:"13",chapitre:"exploitation",gravite:1,titre:"Formation du personnel",question:"Le personnel, y compris int\xE9rimaire et des entreprises ext\xE9rieures, est-il form\xE9 aux risques et aux consignes, et des \xE9quipiers \xE0 l'usage des moyens de secours ?",aide:"Le plan de d\xE9fense incendie justifie les comp\xE9tences du personnel (extincteurs, RIA, moyens fixes).",preuves:["Attestations de formation","Liste des \xE9quipiers de premi\xE8re intervention"]}],titresPoints:{"1.1":"Conformit\xE9 aux plans du dossier","1.2":"Dossier de l'installation","1.4":"\xC9tat des mati\xE8res stock\xE9es","1.5":"Dispositions en cas d'incendie","1.6":"Eau : r\xE9seaux, rejets, s\xE9parateur","1.7":"D\xE9chets","1.8":"Contr\xF4le p\xE9riodique (d\xE9claration)","2":"Implantation et distances","3.1":"Acc\xE8s des secours au site","3.2":"Voie engins","3.3":"Aires de stationnement des secours","3.4":"Acc\xE8s aux issues et quais","3.5":"Documents pour les secours","4":"Dispositions constructives","5":"D\xE9senfumage","6":"Compartimentage","7":"Dimensions des cellules","8":"Mati\xE8res dangereuses et incompatibles","9":"Conditions de stockage","10":"R\xE9tentions","11":"Eaux d'extinction","12":"D\xE9tection automatique d'incendie","13":"Moyens de lutte contre l'incendie","14":"\xC9vacuation du personnel","15":"Installations \xE9lectriques et foudre","16":"\xC9clairage","17":"Ventilation et charge des batteries","18":"Chauffage","20":"Travaux et feu","21":"Consignes","22":"Maintenance des mat\xE9riels de s\xE9curit\xE9","23":"Plan de d\xE9fense incendie","24":"Bruit","25":"Surveillance et contr\xF4le des acc\xE8s","27":"Cellules frigorifiques","28":"Cellules de liquides combustibles"}};var st="2026-2027",xe=V.verifie_le,w=tt,Tt=V.chapitres,B=V.points,qe=V.titresPoints,G={am2017:{titre:"Arr\xEAt\xE9 du 11 avril 2017 relatif aux prescriptions g\xE9n\xE9rales applicables aux entrep\xF4ts couverts soumis \xE0 la rubrique 1510 (version consolid\xE9e)",url:"https://www.legifrance.gouv.fr/lod erifie_le:"2026-10-24",unite:"tonnes (quantit\xE9 totale susceptible d'\xEAtre pr\xE9sente) sauf mention contraire ; 0.05 = 50 kg",conventions:{bornes:"Chaque nombre est la quantit\xE9 minimale (>=) \xE0 partir de laquelle le r\xE9gime s'applique ; le r\xE9gime sup\xE9rieur l'emporte. null = r\xE9gime inexistant. Une valeur 0.0 signifie \xAB d\xE8s la premi\xE8re unit\xE9 \xBB (alin\xE9a du type \xAB inf\xE9rieure \xE0 100 kg dans les autres cas \xBB).",regimes_par_etat:"Quand ce champ existe (4110-4140), 'regimes' vaut null : utiliser l'\xE9tat physique (solide/liquide/gaz) de la substance.",regimes_par_cas:"Quand ce champ existe, 'regimes' donne le cas indiqu\xE9 dans la note ; choisir le cas correspondant au stockage.","A-x":"Le chiffre apr\xE8s A (A-1, A-2...) affich\xE9 dans la nomenclature est le rayon d'affichage de l'enqu\xEAte publique en km ; il est report\xE9 dans la note.",famille:"Famille de la somme de cumul (sante = Sa, physique = Sb, environnement = Sc, aucune = hors sommes). familles_cumul liste toutes les sommes o\xF9 la substance entre (une substance nomm\xE9e peut entrer dans plusieurs).",regime_DC:"DC = d\xE9claration avec contr\xF4le p\xE9riodique (art. L. 512-11). E = enregistrement. A = autorisation."},sources:[{titre:"AIDA (INERIS) - fiches des rubriques 4xxx de la nomenclature ICPE (annexe \xE0 l'article R. 511-9), consult\xE9es le 2026-10-24",url:"https://aida.ineris.fr/thematiques/classement-substances-melanges-dangereux"},{titre:"AIDA - 47xx Substances et m\xE9langes nomm\xE9ment d\xE9sign\xE9s",url:"https://aida.ineris.fr/thematiques/47xx-substances-melanges-nommement-designes"},{titre:"Brochure de la nomenclature des installations class\xE9es, \xE9dition v58 - 06/2026 (INERIS/DGPR) - articles R. 511-10 \xE0 R. 511-12",url:"https://aida.ineris.fr/sites/default/files/2026-07/BrochureNom_v58.pdf"},{titre:"D\xE9cret n\xB0 2014-285 du 3 mars 2014 modifiant la nomenclature (Seveso 3), texte des articles R. 511-10 \xE0 R. 511-12 et annexe",url:"https://aida.ineris.fr/node/32500"},{titre:"AIDA - Nomenclature ICPE (page d'accueil, versions PDF)",url:"https://aida.ineris.fr/thematiques/nomenclature-icpe?lien-direct=1"}],cumul:{description:"Article R. 511-10 : un \xE9tablissement est Seveso seuil haut s'il remplit la r\xE8gle de d\xE9passement direct seuil haut OU la r\xE8gle de cumul seuil haut ; sinon il est seuil bas s'il remplit l'une des deux r\xE8gles au seuil bas. R\xC8GLE DE D\xC9PASSEMENT DIRECT (R. 511-11 I) : pour au moins une rubrique, la quantit\xE9 totale des substances qu'elle vise, pr\xE9sentes dans l'\xE9tablissement (m\xEAme exploitant, m\xEAme site), est >= au seuil bas (resp. haut) de cette rubrique. Pour les rubriques 4100 \xE0 4699, on compte TOUTES les substances ayant la classe/cat\xE9gorie/mention de danger vis\xE9e (y compris d\xE9chets 2700-2799 et substances 4800-4899), SAUF les substances nomm\xE9es 4700-4799, 2760-4 et 2792, qui sont compar\xE9es au seuil de leur propre rubrique. Une m\xEAme substance peut donc compter dans plusieurs rubriques g\xE9n\xE9riques. Les rubriques sans seuil bas sont ignor\xE9es pour le seuil bas. R\xC8GLE DE CUMUL (R. 511-11 II) : la r\xE8gle est remplie si au moins une des sommes Sa, Sb, Sc est >= 1, calcul\xE9e s\xE9par\xE9ment pour le seuil bas et pour le seuil haut : S = somme sur x de qx / Qx, o\xF9 qx = quantit\xE9 de la substance ou du m\xE9lange x pr\xE9sente dans l'\xE9tablissement et Qx = seuil bas (resp. haut) applicable. Sa (dangers pour la sant\xE9) : substances relevant des classes/cat\xE9gories/mentions des rubriques 4100 \xE0 4199, y compris les substances nomm\xE9es 4700-4899 et les d\xE9chets 2700-2799 pr\xE9sentant ces dangers. Sb (dangers physiques) : idem avec les rubriques 4200 \xE0 4499. Sc (dangers pour l'environnement) : idem avec les rubriques 4500 \xE0 4599. Choix de Qx : si la substance est nomm\xE9e en 2760-3, 2792 ou 4700-4799, Qx = seuil de cette rubrique nomm\xE9e (elle entre dans chaque somme correspondant \xE0 ses dangers, avec ce m\xEAme Qx) ; sinon Qx = seuil de la rubrique applicable de la plage concern\xE9e ; si une substance rel\xE8ve de plusieurs rubriques d'une m\xEAme plage, on retient le plus petit seuil (bas ou haut selon le calcul). d) Pour la r\xE8gle de cumul seuil bas, les substances nomm\xE9es 4700-4799 sans seuil bas sont exclues des sommes. e) Les substances pr\xE9sentes en quantit\xE9 <= 2 % du seuil pertinent ne sont pas compt\xE9es dans qx si leur emplacement ne peut pas d\xE9clencher un accident majeur ailleurs sur le site. Les rubriques 46xx (4610, 4620, 4630) n'entrent dans aucune somme : elles ne jouent que pour le d\xE9passement direct. Rubrique 4001 : installation pr\xE9sentant un grand nombre de substances dangereuses v\xE9rifiant la r\xE8gle de cumul seuil bas ou seuil haut (A-1). Classement ICPE (r\xE9gimes A/E/DC/D) : R. 511-12 - une substance est class\xE9e d'abord dans la rubrique 27xx, 47xx ou 48xx qui la nomme ; sinon dans la rubrique 4100-4699 de plus petit seuil haut (d\xE9partage : seuil bas, puis seuils A, E, D les plus bas). Pour le r\xE9gime, on compare la quantit\xE9 totale par rubrique aux seuils de cette rubrique.",formule:"S = \u03A3 qx / Qx ; r\xE8gle remplie si Sa >= 1 ou Sb >= 1 ou Sc >= 1 (calcul s\xE9par\xE9 seuil bas / seuil haut)",familles:{sante:["4110","4120","4130","4140","4150"],physique:["4210","4220","4240","4310","4320","4321","4330","4331","4410","4411","4420","4421","4422","4430","4431","4440","4441","4442"],environnement:["4510","4511"],hors_cumul_depassement_direct_seulement:["4610","4620","4630"],nommees_selon_dangers:["4701","4702","4703","4715","4718","4719","4722","4725","4734","4735","4741","4755"]},exclusions_seuil_bas:"Substances nomm\xE9es 47xx sans seuil bas exclues des sommes seuil bas (point d) ; substances <= 2 % du seuil exclues sous condition (point e)."},rubriques:{"4110":{intitule:"Toxicit\xE9 aigu\xEB cat\xE9gorie 1 pour l'une au moins des voies d'exposition, \xE0 l'exclusion de l'uranium et ses compos\xE9s",regimes:null,seveso:{bas:5,haut:20},famille:"sante",familles_cumul:["sante"],mentions:["H300","H310","H330"],source:"https://aida.ineris.fr/reglementation/4110-toxicite-aigue-categorie-1-lune-moins-voies-dexposition-a-lexclusion-luranium",regimes_par_etat:{solide:{A:1,E:null,DC:.2,D:null},liquide:{A:.25,E:null,DC:.05,D:null},gaz:{A:.05,E:null,DC:.01,D:null}},note:"Seuils de r\xE9gime selon l'\xE9tat physique (voir regimes_par_etat). A-1 (solides, liquides), A-3 (gaz). Cat\xE9gorie 1 uniquement (les mentions H300/H310/H330 sont aussi celles de la cat. 2 : v\xE9rifier la cat\xE9gorie sur la FDS)."},"4120":{intitule:"Toxicit\xE9 aigu\xEB cat\xE9gorie 2, pour l'une au moins des voies d'exposition",regimes:null,seveso:{bas:50,haut:200},famille:"sante",familles_cumul:["sante"],mentions:["H300","H310","H330"],source:"https://aida.ineris.fr/reglementation/4120-toxicite-aigue-categorie-2-lune-moins-voies-dexposition",regimes_par_etat:{solide:{A:50,E:null,DC:null,D:5},liquide:{A:10,E:null,DC:null,D:1},gaz:{A:2,E:null,DC:null,D:.2}},note:"Seuils de r\xE9gime selon l'\xE9tat physique (voir regimes_par_etat). A-1 (solides, liquides), A-3 (gaz). Cat\xE9gorie 2 uniquement."},"4130":{intitule:"Toxicit\xE9 aigu\xEB cat\xE9gorie 3 pour les voies d'exposition par inhalation",regimes:null,seveso:{bas:50,haut:200},famille:"sante",familles_cumul:["sante"],mentions:["H331"],source:"https://aida.ineris.fr/reglementation/4130-toxicite-aigue-categorie-3-voies-dexposition-inhalation",regimes_par_etat:{solide:{A:50,E:null,DC:null,D:5},liquide:{A:10,E:null,DC:null,D:1},gaz:{A:2,E:null,DC:null,D:.2}},note:"Seuils de r\xE9gime selon l'\xE9tat physique (voir regimes_par_etat). A-1 (solides, liquides), A-3 (gaz)."},"4140":{intitule:"Toxicit\xE9 aigu\xEB cat\xE9gorie 3 pour la voie d'exposition orale",regimes:null,seveso:{bas:50,haut:200},famille:"sante",familles_cumul:["sante"],mentions:["H301"],source:"https://aida.ineris.fr/reglementation/4140-toxicite-aigue-categorie-3-voie-dexposition-orale",regimes_par_etat:{solide:{A:50,E:null,DC:null,D:5},liquide:{A:10,E:null,DC:null,D:1},gaz:{A:2,E:null,DC:null,D:.2}},note:"H301 dans le cas o\xF9 ni la classification de toxicit\xE9 aigu\xEB par inhalation ni celle par voie cutan\xE9e ne peuvent \xEAtre \xE9tablies. Seuils selon l'\xE9tat physique (voir regimes_par_etat)."},"4150":{intitule:"Toxicit\xE9 sp\xE9cifique pour certains organes cibles (STOT) exposition unique cat\xE9gorie 1",regimes:{A:20,E:null,DC:null,D:5},seveso:{bas:50,haut:200},famille:"sante",familles_cumul:["sante"],mentions:["H370"],source:"https://aida.ineris.fr/reglementation/4150-toxicite-specifique-certains-organes-cibles-stot-exposition-unique-categorie-1",note:"A-1."},"4210":{intitule:"Produits explosifs \xE0 l'exclusion de la fabrication industrielle par transformation chimique ou biologique",regimes:{A:.1,E:null,DC:.001,D:null},seveso:{bas:10,haut:10},famille:"physique",familles_cumul:["physique"],mentions:["H200","H201","H202","H203","H204","H205"],source:"https://aida.ineris.fr/reglementation/4210-produits-explosifs-a-lexclusion-fabrication-industrielle-transformation",regimes_par_cas:{"1_fabrication_conditionnement":{A:.1,E:null,DC:.001,D:null},"2_unite_mobile":{A:.1,E:null,DC:null,D:0}},note:"Quantit\xE9 totale de mati\xE8re active. Alin\xE9a 1 (fabrication, chargement, encartouchage, conditionnement, essais...) : A-3 >= 100 kg ; DC >= 1 kg. Alin\xE9a 2 (fabrication en unit\xE9 mobile) : A-3 >= 100 kg ; D < 100 kg (voir regimes_par_cas). Activit\xE9 de fabrication/conditionnement, pas de stockage (le stockage rel\xE8ve de 4220)."},"4220":{intitule:"Stockage de produits explosifs (\xE0 l'exclusion des produits explosifs pr\xE9sents dans les espaces de vente des ERP)",regimes:{A:.5,E:.1,DC:.03,D:null},seveso:{bas:10,haut:10},famille:"physique",familles_cumul:["physique"],mentions:["H200","H201","H202","H203","H204","H205"],source:"https://aida.ineris.fr/reglementation/4220-stockage-produits-explosifs-a-lexclusion-produits-explosif
